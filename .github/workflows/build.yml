name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Runs once. The key is committed so every later build keeps the same
      # signature and can be installed as an update over the previous APK.
      - name: Create stable signing key (first run only)
        run: |
          set -euo pipefail
          if [ ! -f signing/nfcvault.jks ]; then
            mkdir -p signing
            keytool -genkeypair \
              -keystore signing/nfcvault.jks \
              -storepass nfcvault -keypass nfcvault \
              -alias nfcvault -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NFC Vault, O=Personal, C=US"
            printf 'storeFile=signing/nfcvault.jks\nstorePassword=nfcvault\nkeyAlias=nfcvault\nkeyPassword=nfcvault\n' > keystore.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/nfcvault.jks keystore.properties
            git commit -m "chore: add stable signing keystore [skip ci]"
            git push
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-vault-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
